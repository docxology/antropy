schema_version: 1
seed: 20261010
shapes: [[32], [8, 10], [5, 6, 7]]
sample_sizes: [4, 8, 16]
repetitions: 64
scenarios:
  - {id: "null", label: Identical distributions, role: "null", first_probability: 0.25, second_probability: 0.25}
  - {id: weak, label: Moderate replacement contrast, role: alternative, first_probability: 0.25, second_probability: 0.5}
  - {id: strong, label: Large replacement contrast, role: alternative, first_probability: 0.25, second_probability: 0.75}
analyses:
  - label: Native HDSE (r=2.5)
    geometry: native
    spec:
      id: hdse
      measure: hdse
      parameters:
        embedding: {shape: 2, max_templates: 1000, max_pairs: 500000, max_memory_bytes: 134217728}
        match: {tolerance: 2.5, block_size: 64}
  - label: Native HDSE (r=1.5)
    geometry: native
    spec:
      id: hdse_sparse
      measure: hdse
      parameters:
        embedding: {shape: 2, max_templates: 1000, max_pairs: 500000, max_memory_bytes: 134217728}
        match: {tolerance: 1.5, block_size: 64}
  - label: Normalized Shannon entropy
    geometry: symbols
    spec: {id: shannon, measure: shannon_entropy, parameters: {normalize: true}}
  - label: Statistical complexity
    geometry: symbols
    spec:
      id: statistical
      measure: statistical_complexity
      parameters: {config: {alphabet_size: 16}}
alpha: 0.05
confidence_level: 0.95
target_power: 0.8
multiplicity: holm
test:
  seed: 20261011
  pairing: independent
  alternative: two_sided
  mode: auto
  resamples: 499
  max_exact_allocations: 1000
  max_samples: 100
  max_resampling_work: 1000000
period: 12.0
phase_origin: 1
symbol_range: [-4.0, 4.0]
symbol_bins: 16
max_input_elements: 10000
max_fields: 20000
max_distance_component_visits: 5000000000
max_inference_work: 100000000
max_pool_bytes: 1048576
max_report_bytes: 95000000
